[project]
name = "editorial-images"
version = "0.1.0"
description = "Generate, validate, and review explicit editorial art for Tal Perry's Hugo posts."
requires-python = ">=3.12"
dependencies = [
  "openai>=1.109.0",
  "pillow>=11.3.0",
  "pydantic>=2.11.7",
  "python-dotenv>=1.1.1",
]

[project.scripts]
editorial-images = "editorial_images.cli:main"

[dependency-groups]
dev = [
  "basedpyright>=1.31.4",
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests"]
